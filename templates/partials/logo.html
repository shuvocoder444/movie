{% load static %}
{% if site_settings and site_settings.logo_url %}
  <img src="{{ site_settings.logo_url }}" alt="{{ site_settings.site_name|default:'IndiMusic TV' }}" height="32" style="max-height: 32px; width: auto; object-fit: contain;">
{% else %}
  <img src="{% static 'img/branding/indimusic-logo-transparent.png' %}" alt="IndiMusic TV" height="32" style="max-height: 32px; width: auto; object-fit: contain;">
{% endif %}
