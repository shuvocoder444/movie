{% load static %}

<!-- Local Fonts & Icons (100% downloaded in project, zero external CDN) -->
<link rel="stylesheet" href="{% static 'vendor/fonts/public-sans.css' %}" />
<link rel="stylesheet" href="{% static 'vendor/fonts/tabler-icons.css' %}" />
<link rel="stylesheet" href="{% static 'vendor/fonts/fontawesome.css' %}" />

<!-- Core CSS -->
{% if rtl_support %}
<link rel="stylesheet" href="{% static 'vendor/css/rtl/core.css' %}" class="{{ has_customizer|yesno:'template-customizer-core-css,' }}" id="template-customizer-core-css" />
<link rel="stylesheet" href="{% static 'vendor/css/rtl/theme-default.css' %}" class="{{ has_customizer|yesno:'template-customizer-theme-css,' }}" id="template-customizer-theme-css" />
{% else %}
<link rel="stylesheet" href="{% static 'vendor/css/core.css' %}" class="{{ has_customizer|yesno:'template-customizer-core-css,' }}" id="template-customizer-core-css" />
<link rel="stylesheet" href="{% static 'vendor/css/theme-default.css' %}" class="{{ has_customizer|yesno:'template-customizer-theme-css,' }}" id="template-customizer-theme-css" />
{% endif %}

<link rel="stylesheet" href="{% static 'css/demo.css' %}" />
<link rel="stylesheet" href="{% static 'vendor/css/pages/front-page.css' %}" />
<link rel="stylesheet" href="{% static 'vendor/libs/node-waves/node-waves.css' %}" />

<!-- CinePulse Unified Theme CSS: 1600px Max-Width & Dual Dark/Light Mode -->
<link rel="stylesheet" href="{% static 'css/cinema-theme.css' %}" />

<!-- Early theme initialization: Defaults to Light (Sada) mode -->
<script>
  (function() {
    try {
      var savedTheme = localStorage.getItem('cinepulse-theme') || 'light';
      document.documentElement.setAttribute('data-theme', savedTheme);
      if (savedTheme === 'dark') {
        document.documentElement.classList.add('dark-style');
        document.documentElement.classList.remove('light-style');
      } else {
        document.documentElement.classList.add('light-style');
        document.documentElement.classList.remove('dark-style');
      }
    } catch(e) {}
  })();
</script>
